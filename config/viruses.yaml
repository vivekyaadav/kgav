# Curated virus register for the Coronaviridae v1 spine.
#
# Every field here is a CURATION DECISION, not a lookup result. proteome_id is
# pinned because several taxa expose more than one "Reference proteome" and an
# unpinned choice makes the build non-reproducible. mondo is pinned because
# label matching is banned — see normalize_bio.MondoResolver.
#
# mondo: null means "not yet curated"; the ingest emits no CAUSES edge and
# reports it.
#
# ---------------------------------------------------------------------------
# chain_source AND THE SPECIES/STRAIN TRAP
#
# THE BUG CLASS THIS FIELD EXISTS TO PREVENT. Swiss-Prot frequently curates a
# virus under a STRAIN or ISOLATE taxon while the species taxon carries only a
# TrEMBL proteome with no Chain features. Query the species and you get zero
# mature peptides -- no error, no missing-data signal, just a direct-acting
# channel with nothing to point at. It cost this project the MERS Mpro and
# RdRp once already (species 1335626 is TrEMBL-only; the curation is under
# isolate 1263720), and HKU1 the same way (290028 -> 443239).
#
# It is NOT a coronavirus quirk. Measured against UniProt on 2026-09-17, SEVEN
# of the nine surveyed flaviviruses are curated under a strain taxon and only
# Zika and West Nile at the species level. A `taxonomy_id:` search would paper
# over this by silently walking down the lineage and picking something; that
# is exactly the silent fallback this register forbids.
#
# So every entry declares chain_source explicitly:
#
#   chain_source.taxon      where the coordinate-bearing PRO_ chains ACTUALLY
#                           live. Equal to `taxon` when the species is curated.
#   chain_source.accession  the reviewed polyprotein those chains hang off.
#   chain_source.chains     how many PRO_ chains carry start/end coordinates,
#                           so a silent drop to zero is a diff, not a mystery.
#   chain_source.verified   the date that was measured, not assumed.
#
# RULE, enforced by kgav.virus_register.validate and by validate_release.py:
# if chain_source.taxon differs from taxon, that taxon MUST also appear in
# isolate_taxa. There is no implicit descendant lookup anywhere in this
# pipeline, and adding one would recreate the bug.
# ---------------------------------------------------------------------------

viruses:
  - taxon: "2697049"
    chain_source: {accession: P0DTD1, taxon: "2697049", chains: 16,
                   verified: "2026-09-17"}   # species is curated; no isolate needed
    name: SARS-CoV-2
    proteome_id: UP000464024
    mondo: "MONDO:0100096"
    mondo_source: "DOID:0080600 xref, verified 2026-09"

  - taxon: "694009"
    chain_source: {accession: P0C6X7, taxon: "694009", chains: 15,
                   verified: "2026-09-17"}   # species is curated; no isolate needed
    name: SARS-CoV
    proteome_id: UP000000354
    mondo: "MONDO:0005091"
    mondo_source: "severe acute respiratory syndrome; sole exact match, verified 2026-09"

  - taxon: "1335626"
    chain_source: {accession: K9N7C7, taxon: "1263720", chains: 15,
                   verified: "2026-09-17"}   # STRAIN: species proteome is TrEMBL-only, zero Chain features
    name: MERS-CoV
    # VirHostNet and Swiss-Prot both file this under an isolate taxon;
    # the species query returns zero rows.
    isolate_taxa: ["1263720"]
    proteome_id: UP000112279
    # UP000112279 is TrEMBL-only: its ORF1ab entry (K0BWD0) carries zero Chain
    # features, so Mpro and RdRp would be absent from the graph entirely.
    # Swiss-Prot curates the HCoV-EMC/2012 isolate (taxon 1263720) instead.
    # These accessions are pulled in addition to the proteome and reassigned
    # to the SPECIES taxon, so cross-viral metapaths still resolve.
    extra_accessions: [K9N7C7, K9N638, K9N5Q8, K9N4V7, K9N5R3, K9N7A1,
                       K9N643, K9N7D2, K9N4V0, K9N796]
    curation_note: "reviewed entries filed under isolate taxon 1263720"
    mondo: "MONDO:0100116"
    mondo_source: "Middle East respiratory syndrome; verified 2026-09"

  - taxon: "11137"
    chain_source: {accession: P0C6X1, taxon: "11137", chains: 15,
                   verified: "2026-09-17"}   # species is curated; no isolate needed
    name: HCoV-229E
    proteome_id: UP000006716
    # No specific MONDO term exists. The only candidate is the generic
    # MONDO:0005709 (common cold), shared with the other seasonal
    # coronaviruses. Mapping four distinct viruses -- two alpha, two beta --
    # onto one disease node would make them look connected when they are not,
    # and a prediction "for the common cold" could not be attributed back to
    # the virus it came from. Left null: nothing in M1-M6 routes through
    # Disease, so no signal is lost.
    mondo: null
    mondo_source: null

  - taxon: "277944"
    chain_source: {accession: P0C6X5, taxon: "277944", chains: 15,
                   verified: "2026-09-17"}   # species is curated; no isolate needed
    name: HCoV-NL63
    proteome_id: UP000008573
    # No specific MONDO term exists. The only candidate is the generic
    # MONDO:0005709 (common cold), shared with the other seasonal
    # coronaviruses. Mapping four distinct viruses -- two alpha, two beta --
    # onto one disease node would make them look connected when they are not,
    # and a prediction "for the common cold" could not be attributed back to
    # the virus it came from. Left null: nothing in M1-M6 routes through
    # Disease, so no signal is lost.
    mondo: null
    mondo_source: null

  - taxon: "31631"
    chain_source: {accession: P0C6X6, taxon: "31631", chains: 15,
                   verified: "2026-09-17"}   # species is curated; no isolate needed
    name: HCoV-OC43
    proteome_id: UP000007552
    # No specific MONDO term exists. The only candidate is the generic
    # MONDO:0005709 (common cold), shared with the other seasonal
    # coronaviruses. Mapping four distinct viruses -- two alpha, two beta --
    # onto one disease node would make them look connected when they are not,
    # and a prediction "for the common cold" could not be attributed back to
    # the virus it came from. Left null: nothing in M1-M6 routes through
    # Disease, so no signal is lost.
    mondo: null
    mondo_source: null

  - taxon: "290028"
    chain_source: {accession: P0C6X2, taxon: "443239", chains: 15,
                   verified: "2026-09-17"}   # STRAIN: species query returns no curated polyprotein
    name: HCoV-HKU1
    # VirHostNet and Swiss-Prot both file this under an isolate taxon;
    # the species query returns zero rows.
    isolate_taxa: ["443239"]
    proteome_id: UP000008170
    # No specific MONDO term exists. The only candidate is the generic
    # MONDO:0005709 (common cold), shared with the other seasonal
    # coronaviruses. Mapping four distinct viruses -- two alpha, two beta --
    # onto one disease node would make them look connected when they are not,
    # and a prediction "for the common cold" could not be attributed back to
    # the virus it came from. Left null: nothing in M1-M6 routes through
    # Disease, so no signal is lost.
    mondo: null
    mondo_source: null


# ---------------------------------------------------------------------------
# SURVEYED, NOT BUILT. Measured 2026-09-17; no ingest reads this list yet.
# ingest_spine.py reads `viruses:` only, so nothing here changes the v1 build.
# An entry graduates by being moved into `viruses:` above.
#
# WHY THIS SECTION IS HERE RATHER THAN IN A NOTE. Seven of these nine are
# curated under a strain taxon, and the species taxon returns a TrEMBL
# proteome with ONE protein and no Chain features. That is the MERS trap at
# seven times the scale. Recording the strain taxa now, validated by the same
# rule as the coronaviruses, is what stops the next build rediscovering it.
#
# Every chain_source below was verified against UniProt on the date shown:
# reviewed entry, PRO_ chain ids present, start/end coordinates present.
# ---------------------------------------------------------------------------
surveyed:
  - taxon: "11053"
    name: DENV-1
    family: Flaviviridae
    full_name: "Dengue virus type 1"
    proteome_id: UP000095813
    # Species 11053 has no curated polyprotein: its reference proteome is
    # TrEMBL-only with a single protein and zero Chain features. The 13-16
    # mature peptides are curated under strain 408685 (Brazil/97-11/1997).
    # Without this mapping every chain-level target is silently absent.
    isolate_taxa: ["408685"]
    chain_source: {accession: P27909, taxon: "408685", chains: 14,
                   verified: "2026-09-17"}
    # No MONDO term pinned. Label matching is banned (normalize_bio.
    # MondoResolver), and no xref has been curated for this taxon yet.
    mondo: null
    mondo_source: null

