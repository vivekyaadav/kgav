# Curated virus register for the Coronaviridae v1 spine.
#
# Every field here is a CURATION DECISION, not a lookup result. proteome_id is
# pinned because several taxa expose more than one "Reference proteome" and an
# unpinned choice makes the build non-reproducible. mondo is pinned because
# label matching is banned — see normalize_bio.MondoResolver.
#
# mondo: null means "not yet curated"; the ingest emits no CAUSES edge and
# reports it.
#
# ---------------------------------------------------------------------------
# chain_source AND THE SPECIES/STRAIN TRAP
#
# THE BUG CLASS THIS FIELD EXISTS TO PREVENT. Swiss-Prot frequently curates a
# virus under a STRAIN or ISOLATE taxon while the species taxon carries only a
# TrEMBL proteome with no Chain features. Query the species and you get zero
# mature peptides -- no error, no missing-data signal, just a direct-acting
# channel with nothing to point at. It cost this project the MERS Mpro and
# RdRp once already (species 1335626 is TrEMBL-only; the curation is under
# isolate 1263720), and HKU1 the same way (290028 -> 443239).
#
# It is NOT a coronavirus quirk. Measured against UniProt on 2026-09-17, SEVEN
# of the nine surveyed flaviviruses are curated under a strain taxon and only
# Zika and West Nile at the species level. A `taxonomy_id:` search would paper
# over this by silently walking down the lineage and picking something; that
# is exactly the silent fallback this register forbids.
#
# So every entry declares chain_source explicitly:
#
#   chain_source.taxon      where the coordinate-bearing PRO_ chains ACTUALLY
#                           live. Equal to `taxon` when the species is curated.
#   chain_source.accession  the reviewed polyprotein those chains hang off.
#   chain_source.chains     how many PRO_ chains carry start/end coordinates,
#                           so a silent drop to zero is a diff, not a mystery.
#   chain_source.verified   the date that was measured, not assumed.
#
# RULE, enforced by kgav.virus_register.validate and by validate_release.py:
# if chain_source.taxon differs from taxon, that taxon MUST also appear in
# isolate_taxa. There is no implicit descendant lookup anywhere in this
# pipeline, and adding one would recreate the bug.
# ---------------------------------------------------------------------------

viruses:
  - taxon: "2697049"
    chain_source: {accession: P0DTD1, taxon: "2697049", chains: 16,
                   verified: "2026-09-17"}   # species is curated; no isolate needed
    name: SARS-CoV-2
    proteome_id: UP000464024
    mondo: "MONDO:0100096"
    mondo_source: "DOID:0080600 xref, verified 2026-09"

  - taxon: "694009"
    chain_source: {accession: P0C6X7, taxon: "694009", chains: 15,
                   verified: "2026-09-17"}   # species is curated; no isolate needed
    name: SARS-CoV
    # ISOLATES DECLARED FOR THE PPI LAYER, NOT FOR CHAINS. chain_source above
    # is the species itself, so nothing here is needed to find mature
    # peptides. These two are declared because VirHostNet files 73 host-viral
    # interactions under them.
    #
    # DECLARING THEM RECOVERS NOTHING TODAY, AND THE MEASUREMENT SAYS SO.
    # Running ingest_vhppi with and without these two entries gives a
    # byte-identical layer -- 10,888 edges either way -- and the assembled
    # release is unchanged at 71,261 nodes / 370,937 edges, with
    # check_results reporting 0 stale against results computed before the
    # change.
    #
    # The reason is the gate order in vhppi.ingest_mitab. `unmapped_viral_taxon`
    # is 0 in BOTH runs, so these rows never reach the taxon map: they are
    # dropped earlier, at `unresolved_id`, because an isolate carries its own
    # UniProt accessions and the spine builds SARS-CoV protein nodes from the
    # species reference proteome UP000000354. The taxon map is never consulted
    # for a row whose identifiers did not resolve.
    #
    # WHAT WOULD ACTUALLY RECOVER THEM is extra_accessions, the mechanism MERS
    # uses above: pull the isolate's reviewed accessions alongside the
    # proteome and reassign them to the species taxon, so the alias index can
    # resolve them. That is a spine change and it is not done here. These
    # entries stay because they are true and because they are the breadcrumb
    # to the 73 rows; they are not load-bearing.
    #
    # Found by the VirHostNet taxon histogram in
    # diagnose_flavivirus_join.py, which prints every taxon in the files and
    # flags the ones outside this map. Identified from UniProt taxonomy
    # (rest.uniprot.org/taxonomy/<id>.json) on 2026-10-11, not from memory:
    #
    #   227984  SARS coronavirus Tor2     66 rows   lineage ... -> 694009
    #   698419  SARS coronavirus wtic-MB   7 rows   lineage ... -> 694009
    #                                                -> 698398 recombinant SARSr-CoV
    #
    # 698419 IS A CURATION JUDGEMENT, not a lookup. Its parent is
    # "recombinant SARSr-CoV": wtic-MB is an infectious cDNA clone, so its
    # proteins are authentic SARS-CoV sequences and its host interactions are
    # SARS-CoV host interactions. Someone who wants engineered constructs out
    # of the graph should remove this line, and the reasoning is recorded here
    # so that disagreement is possible.
    #
    # 698398 itself is NOT declared: it does not appear in the files, and the
    # register's rule is to declare what is observed rather than what might be.
    #
    # NEITHER CARRIES CHEMBL ACTIVITY. Checked before declaring them, because
    # declared_taxa feeds ingest_chembl and ingest_selectivity as well as
    # ingest_vhppi, and a label-set change would have moved every evaluation
    # figure in docs/evaluation.md. Both return zero rows for
    # IC50/EC50/Ki/Kd, so this is a PPI-only change.
    isolate_taxa: ["227984", "698419"]
    curation_note: "isolates present in VirHostNet; INERT until extra_accessions lets the spine resolve their identifiers. No ChEMBL activity under either."
    proteome_id: UP000000354
    mondo: "MONDO:0005091"
    mondo_source: "severe acute respiratory syndrome; sole exact match, verified 2026-09"

  - taxon: "1335626"
    chain_source: {accession: K9N7C7, taxon: "1263720", chains: 15,
                   verified: "2026-09-17"}   # STRAIN: species proteome is TrEMBL-only, zero Chain features
    name: MERS-CoV
    # VirHostNet and Swiss-Prot both file this under an isolate taxon;
    # the species query returns zero rows.
    isolate_taxa: ["1263720"]
    proteome_id: UP000112279
    # UP000112279 is TrEMBL-only: its ORF1ab entry (K0BWD0) carries zero Chain
    # features, so Mpro and RdRp would be absent from the graph entirely.
    # Swiss-Prot curates the HCoV-EMC/2012 isolate (taxon 1263720) instead.
    # These accessions are pulled in addition to the proteome and reassigned
    # to the SPECIES taxon, so cross-viral metapaths still resolve.
    extra_accessions: [K9N7C7, K9N638, K9N5Q8, K9N4V7, K9N5R3, K9N7A1,
                       K9N643, K9N7D2, K9N4V0, K9N796]
    curation_note: "reviewed entries filed under isolate taxon 1263720"
    mondo: "MONDO:0100116"
    mondo_source: "Middle East respiratory syndrome; verified 2026-09"

  - taxon: "11137"
    chain_source: {accession: P0C6X1, taxon: "11137", chains: 15,
                   verified: "2026-09-17"}   # species is curated; no isolate needed
    name: HCoV-229E
    proteome_id: UP000006716
    # No specific MONDO term exists. The only candidate is the generic
    # MONDO:0005709 (common cold), shared with the other seasonal
    # coronaviruses. Mapping four distinct viruses -- two alpha, two beta --
    # onto one disease node would make them look connected when they are not,
    # and a prediction "for the common cold" could not be attributed back to
    # the virus it came from. Left null: nothing in M1-M6 routes through
    # Disease, so no signal is lost.
    mondo: null
    mondo_source: null

  - taxon: "277944"
    chain_source: {accession: P0C6X5, taxon: "277944", chains: 15,
                   verified: "2026-09-17"}   # species is curated; no isolate needed
    name: HCoV-NL63
    proteome_id: UP000008573
    # No specific MONDO term exists. The only candidate is the generic
    # MONDO:0005709 (common cold), shared with the other seasonal
    # coronaviruses. Mapping four distinct viruses -- two alpha, two beta --
    # onto one disease node would make them look connected when they are not,
    # and a prediction "for the common cold" could not be attributed back to
    # the virus it came from. Left null: nothing in M1-M6 routes through
    # Disease, so no signal is lost.
    mondo: null
    mondo_source: null

  - taxon: "31631"
    chain_source: {accession: P0C6X6, taxon: "31631", chains: 15,
                   verified: "2026-09-17"}   # species is curated; no isolate needed
    name: HCoV-OC43
    proteome_id: UP000007552
    # No specific MONDO term exists. The only candidate is the generic
    # MONDO:0005709 (common cold), shared with the other seasonal
    # coronaviruses. Mapping four distinct viruses -- two alpha, two beta --
    # onto one disease node would make them look connected when they are not,
    # and a prediction "for the common cold" could not be attributed back to
    # the virus it came from. Left null: nothing in M1-M6 routes through
    # Disease, so no signal is lost.
    mondo: null
    mondo_source: null

  - taxon: "290028"
    chain_source: {accession: P0C6X2, taxon: "443239", chains: 15,
                   verified: "2026-09-17"}   # STRAIN: species query returns no curated polyprotein
    name: HCoV-HKU1
    # VirHostNet and Swiss-Prot both file this under an isolate taxon;
    # the species query returns zero rows.
    isolate_taxa: ["443239"]
    proteome_id: UP000008170
    # No specific MONDO term exists. The only candidate is the generic
    # MONDO:0005709 (common cold), shared with the other seasonal
    # coronaviruses. Mapping four distinct viruses -- two alpha, two beta --
    # onto one disease node would make them look connected when they are not,
    # and a prediction "for the common cold" could not be attributed back to
    # the virus it came from. Left null: nothing in M1-M6 routes through
    # Disease, so no signal is lost.
    mondo: null
    mondo_source: null


  # ------------------------------------------------------------------------
  # PROMOTED FROM `surveyed:` on 2026-10-11. The entries below are the ones
  # measured there since 2026-09-17, unchanged except for this note and one
  # corrected cross-reference in the Zika comment.
  #
  # WHY THESE TWO, measured by diagnose_flavivirus_join.py against the real
  # ChEMBL, ORCS and VirHostNet sources rather than chosen by reputation:
  #
  #            compounds  protein rows  publications  top PMID  ORCS screens
  #   DENV-2       5,489         1,531           135        1%             3
  #   Zika         3,692           387            78        2%             2
  #
  # The top-PMID column is the reason. Cross-sectional M1 collapsed to AUC
  # 0.499 under --publication-disjoint because 94.9% of compounds shared a
  # PMID between their INHIBITS edge and their own antiviral label: a
  # single-burst 2020 literature. A virus whose activities spread over 135
  # papers and 19 years cannot fail that way. This is not more data inside
  # the same confound, it is a test the coronavirus graph cannot give.
  #
  # AND IT MAKES M8 MEAN SOMETHING. folds.py records that the protease fold
  # is SHARED across Coronaviridae 3CLpro, Picornaviridae 3C and
  # Flaviviridae NS3 (SSF50494, G3DSA:2.40.10.10) and that the discriminator
  # is the catalytic nucleophile. phase0_verify_folds.py already pins P29990
  # and Q32ZE1 as expect=serine, labelled NEGATIVE CONTROL. A cross-family
  # channel had no second family to reach, so "M8 inert" was two faults
  # wearing one label and the unlisted LAYER_PRECEDENCE entry was never the
  # whole story. Enabling that layer is a separate change.
  #
  # WHAT WAS DELIBERATELY NOT DONE. ChEMBL also carries targets under 12637
  # ("Dengue virus", 2 targets) and 11051 ("Flavivirus", 1), which this
  # register does NOT declare. Both are genus- or species-group catch-alls,
  # and folding one into a serotype pools measurements this project keeps
  # separate on purpose -- the same reason orcs.VIRUS_PATTERNS matches each
  # dengue serotype on its own digit and bans a generic `dengue` pattern.
  # Reversible: add them to isolate_taxa with a note saying why.
  #
  # West Nile is the obvious third (775 compounds, 286 protein rows, 2 ORCS
  # screens) and stays in `surveyed:` so promoting it is a deliberate act
  # rather than a side effect of this one.
  # ------------------------------------------------------------------------
  - taxon: "11060"
    name: DENV-2
    family: Flaviviridae
    full_name: "Dengue virus type 2"
    proteome_id: UP000095876
    # Species 11060 has no curated polyprotein: its reference proteome is
    # TrEMBL-only with a single protein and zero Chain features. The 13-16
    # mature peptides are curated under strain 31634 (Thailand/16681/1984; the accession ingest_folds.py already hardcodes).
    # Without this mapping every chain-level target is silently absent.
    isolate_taxa: ["31634"]
    chain_source: {accession: P29990, taxon: "31634", chains: 13,
                   verified: "2026-09-17"}
    # THE MERS MECHANISM, WHICH THIS ENTRY DOCUMENTED AND DID NOT APPLY.
    # The comment above records that species 11060's proteome is TrEMBL-only
    # with zero Chain features, and chain_source points at strain 31634 --
    # but nothing told the build how to REACH that strain, so downloading
    # UP000095876 would build DENV-2 with zero chains exactly as the comment
    # predicts.
    #
    # Checked against UniProt on 2026-10-11, not assumed:
    #   P29990  13 CHAIN features, all with EXACT start/end -- the register's
    #           claimed count is correct. Chains: polyprotein, C, prM, pr, M,
    #           E, NS1, NS2A, NS2B, NS3 (Serine protease NS3), NS4A, NS4B,
    #           NS5 (RNA-directed RNA polymerase/Methyltransferase).
    #           NO proteome cross-reference at all, and it is filed under
    #           strain 31634, so no proteome download produces it.
    #
    # Contrast Zika below: Q32ZE1 also carries 13 chains and IS a component
    # of UP000054557, so it needs no extra_accessions. The two flaviviruses
    # differ and the difference is not guessable from the register alone.
    #
    # ingest_spine reads data/raw/proteomes/EXTRA_<SPECIES taxon>.json.gz --
    # EXTRA_11060.json.gz here -- and curated entries REPLACE the proteome
    # rather than augmenting it. The UP000095876.json.gz file must still
    # exist, because the pfile.exists() guard returns early before the EXTRA
    # file is consulted.
    extra_accessions: [P29990]
    curation_note: "chains live on strain 31634's P29990, which has no proteome xref; pulled via EXTRA_11060.json.gz and reassigned to species 11060"
    # No MONDO term pinned. Label matching is banned (normalize_bio.
    # MondoResolver), and no xref has been curated for this taxon yet.
    mondo: null
    mondo_source: null

  - taxon: "64320"
    name: Zika
    family: Flaviviridae
    full_name: "Zika virus"
    proteome_id: UP000054557
    # Curated AT THE SPECIES TAXON, like five of the seven coronaviruses
    # above: no isolate mapping is needed and none is declared, so the
    # validator can tell "not needed" from "forgotten". (It was one of
    # only two species-curated entries in `surveyed:`; West Nile is
    # the other and is still there.)
    chain_source: {accession: Q32ZE1, taxon: "64320", chains: 13,
                   verified: "2026-09-17"}
    # No MONDO term pinned. Label matching is banned (normalize_bio.
    # MondoResolver), and no xref has been curated for this taxon yet.
    mondo: null
    mondo_source: null

# ---------------------------------------------------------------------------
# SURVEYED, NOT BUILT. Measured 2026-09-17; no ingest reads this list yet.
# ingest_spine.py reads `viruses:` only, so nothing here changes the v1 build.
# An entry graduates by being moved into `viruses:` above.
#
# WHY THIS SECTION IS HERE RATHER THAN IN A NOTE. Six of these seven are
# curated under a strain taxon -- West Nile is the exception -- and the
# species taxon returns a TrEMBL proteome with ONE protein and no Chain
# features. That is the MERS trap at six times the scale. Recording the
# strain taxa now, validated by the same rule as the coronaviruses, is what
# stops the next build rediscovering it.
#
# It was nine entries, seven strain-curated, until DENV-2 and Zika were
# promoted on 2026-10-11. These counts are maintained by hand and the test
# test_surveyed_viruses_are_not_built does not check them, so they are worth
# distrusting if they disagree with the list below.
#
# Every chain_source below was verified against UniProt on the date shown:
# reviewed entry, PRO_ chain ids present, start/end coordinates present.
# ---------------------------------------------------------------------------
