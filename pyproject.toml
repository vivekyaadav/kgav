[project]
name = "kgav"
version = "0.1.0"
description = "Antiviral drug repurposing knowledge graph"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "pandas", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]
chem = ["rdkit>=2024.3"]

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
